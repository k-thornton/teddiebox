<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toniebox playlists</title>
<style>
  :root { --fg: #1c1c1c; --muted: #6b6b6b; --line: #ddd; --bg: #fff; --ok: #1d7a3a; --bad: #b3261e; --accent: #2b5fd9; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --muted: #9a9a9a; --line: #333; --bg: #141414; --ok: #5fcf7a; --bad: #ff7b72; --accent: #7aa2ff; } }
  body { margin: 0; padding: 16px; font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 16px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .uid { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .err { color: var(--bad); font-size: 13px; }
  .ok { color: var(--ok); }
  form { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  input[type=url] { flex: 1 1 260px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--fg); font: inherit; }
  button { padding: 7px 12px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--accent); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<h1>Toniebox playlists</h1>
<p class="hint">Tap a new card on the box once, then paste a YouTube playlist or video URL for it here. Renders take a minute or two; playlist edits are picked up on their own.</p>
<div id="cards"><p class="empty">Loading…</p></div>
<script>
const fmtBytes = b => b ? (b / 1e6).toFixed(1) + " MB" : "";
async function load() {
  const box = document.getElementById("cards");
  let cards;
  try {
    const r = await fetch("/api/cards");
    cards = await r.json();
    if (cards.error) throw new Error(cards.error);
  } catch (e) {
    box.innerHTML = `<p class="err">Could not reach TeddyCloud: ${e.message}</p>`;
    return;
  }
  if (!cards.length) { box.innerHTML = '<p class="empty">No cards yet. Tap one on the box.</p>'; return; }
  box.innerHTML = "";
  for (const c of cards) {
    const el = document.createElement("div");
    el.className = "card";
    const status = c.busy ? '<span class="meta">rendering…</span>'
      : c.error ? `<span class="err">${c.error}</span>`
      : c.rendered ? `<span class="meta"><span class="ok">✓</span> ${c.videos} chapters, ${fmtBytes(c.bytes)}, rendered ${c.rendered.replace("T", " ")}</span>`
      : c.url ? '<span class="meta">waiting for first render</span>'
      : c.tonie ? `<span class="meta">${c.tonie}</span>`
      : c.source ? `<span class="meta">${c.tracks} chapters from ${c.source}</span>`
      : '<span class="meta">nothing assigned yet</span>';
    el.innerHTML = `
      <div class="row"><span class="title">${c.title || c.tonie || "Card"}</span><span class="uid">${c.uid}</span></div>
      <div>${status}</div>
      <form data-uid="${c.uid}">
        <input type="url" name="url" placeholder="https://youtube.com/playlist?list=…" value="${c.url || ""}">
        <button class="primary" type="submit">${c.url ? "Save" : "Assign"}</button>
        ${c.url ? `<button type="button" data-render="${c.ruid}">Render again</button>` : ""}
        ${c.url ? `<button type="button" data-clear="${c.uid}">Remove</button>` : ""}
      </form>`;
    box.appendChild(el);
  }
}
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  await fetch("/api/cards", { method: "POST", body: JSON.stringify({ uid: f.dataset.uid, url: f.url.value }) });
  load();
});
document.addEventListener("click", async e => {
  const b = e.target;
  if (b.dataset.render) { await fetch("/api/render/" + b.dataset.render, { method: "POST" }); load(); }
  if (b.dataset.clear) { await fetch("/api/cards", { method: "POST", body: JSON.stringify({ uid: b.dataset.clear, url: "" }) }); load(); }
});
load();
setInterval(load, 10000);
</script>
</body>
</html>
